name: flatpak

on:
  pull_request:
    branches: ["*"]
    paths:
      # Workflow file itself
      - '.github/workflows/flatpak.yml'
      # Rust files
      - '**.rs'
      # Cargo files
      - 'Cargo.lock'
      - 'Cargo.toml'
      # database
      - "database.toml"
  push:
    branches: ["main", "develop"]
    paths:
      # Workflow file itself
      - '.github/workflows/flatpak.yml'
      # Rust files
      - '**.rs'
      # Cargo files
      - 'Cargo.lock'
      - 'Cargo.toml'
      # database
      - "database.toml"
  workflow_dispatch:

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}-${{github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ams21/cpkg-docker:${{ matrix.version }}

    strategy:
      fail-fast: false

      matrix:
        version:
          # Alma Linux
          - "almalinux-10"
          - "almalinux-9"
          - "almalinux-8"

          # Alpine
          - "alpine-edge"
          - "alpine-3.22"
          - "alpine-3.21"
          - "alpine-3.20"
          - "alpine-3.19"
          - "alpine-3.18"
          - "alpine-3.17"
          - "alpine-3.16"
          - "alpine-3.15"
          - "alpine-3.14"
          - "alpine-3.13"
          - "alpine-3.12"
          - "alpine-3.11"

          # Amazon Linux
          - "amazonlinux-2"
          - "amazonlinux-2023"
          - "amazonlinux-2017.12"

          # Arch Linux
          - "archlinux-latest"

          # Artix Linux
          - "artixlinux-latest"

          # Cachy OS
          - "cachyos-latest"

          # Debian
          - "debian-testing"
          - "debian-unstable"
          - "debian-12"
          - "debian-11"
          - "debian-10"
          - "debian-9"

          # Elementary OS
          - "elementaryos-circe-unstable"
          - "elementaryos-circe-stable"
          - "elementaryos-horus-stable"
          - "elementaryos-horus-unstable"
          - "elementaryos-juno-stable"
          - "elementaryos-juno-unstable"
          - "elementaryos-odin-stable"
          - "elementaryos-odin-unstable"
          - "elementaryos-ubuntu-lunar-unstable"
          - "elementaryos-ubuntu-mantic-unstable"
          - "elementaryos-ubuntu-noble-unstable"

          # Fedora
          - "fedora-43"
          - "fedora-42"
          - "fedora-41"
          - "fedora-40"
          - "fedora-39"
          - "fedora-38"
          - "fedora-37"
          - "fedora-36"
          - "fedora-35"
          - "fedora-34"
          - "fedora-33"
          - "fedora-32"
          - "fedora-31"
          - "fedora-30"
          - "fedora-29"
          - "fedora-28"
          - "fedora-27"
          - "fedora-26"
          - "fedora-25"
          - "fedora-24"
          - "fedora-23"

          # Kali Linux
          - "kalilinux-rolling"
          - "kalilinux-last-release"

          # Linux Mint
          - "linuxmint-22.1"
          - "linuxmint-22"
          - "linuxmint-21.3"
          - "linuxmint-21.2"
          - "linuxmint-21.1"
          - "linuxmint-21"
          - "linuxmint-20.3"
          - "linuxmint-20.2"
          - "linuxmint-20.1"
          - "linuxmint-20"
          - "linuxmint-19.3"
          - "linuxmint-19.2"
          - "linuxmint-19.1"
          - "linuxmint-19"
          - "linuxmint-18"

          # Linux Mint Debian Edition
          - "lmde-6"
          - "lmde-5"
          - "lmde-4"

          # Mageia
          - "mageia-cauldron"
          - "mageia-9"
          - "mageia-8"
          - "mageia-7"
          - "mageia-6"

          # Manjaro
          - "manjaro-latest"

          # Oracle Linux
          - "oraclelinux-9"
          - "oraclelinux-8"
          - "oraclelinux-7"

          # Rocky Linux
          - "rockylinux-9"
          - "rockylinux-8"

          # Ubuntu
          - "ubuntu-25.10"
          - "ubuntu-25.04"
          - "ubuntu-24.10"
          - "ubuntu-24.04"
          - "ubuntu-23.10"
          - "ubuntu-23.04"
          - "ubuntu-22.10"
          - "ubuntu-22.04"
          - "ubuntu-21.10"
          - "ubuntu-21.04"
          - "ubuntu-20.10"
          - "ubuntu-20.04"
          - "ubuntu-19.10"
          - "ubuntu-19.04"
          - "ubuntu-18.10"
          - "ubuntu-18.04"
          - "ubuntu-17.10"
          - "ubuntu-17.04"
          - "ubuntu-16.10"

    steps:
      - name: Checkout
        uses: taiki-e/checkout-action@v1

      - name: Test
        run: cargo test --no-default-features --features "flatpak,_run_actual_installs_when_testing"
